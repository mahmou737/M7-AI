kind = "web"
previewPath = "/"
title = "M7 AI"
version = "1.0.0"
id = "artifacts/m7-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22212

[services.development]
run = "pnpm --filter @workspace/m7-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/m7-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/m7-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22212"
BASE_PATH = "/"
